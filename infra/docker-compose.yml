# Only PostgreSQL runs in Docker. API, worker and frontend run natively for fast iteration.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: keychord
      POSTGRES_PASSWORD: keychord
      POSTGRES_DB: keychord
    ports: ["5432:5432"]
    volumes: [keychord_pg:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keychord"]
      interval: 5s
      retries: 10
volumes:
  keychord_pg:
